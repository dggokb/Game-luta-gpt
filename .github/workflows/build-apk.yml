name: Build and publish updated APK for ccr-60181022-rh9cms
permissions:
  contents: write
on:
  push:
    branches:
      - 'claude/apk-ccr-60181022-rh9cms-20261013-v2'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout requested source snapshot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Python image tooling
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Compile debug APK from source without separate sprite validation
        working-directory: android
        run: gradle :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - name: Verify generated APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/GameLutaGPT-ccr-60181022-rh9cms-atualizado.apk
      - name: Publish direct APK download as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-ccr-60181022-rh9cms-c5baa07-20261013" \
            "release-files/GameLutaGPT-ccr-60181022-rh9cms-atualizado.apk" \
            --repo "${{ github.repository }}" \
            --target "c5baa07cded69b0084146435422aac3fcf881274" \
            --title "APK atualizado ccr-60181022-rh9cms (c5baa07)" \
            --notes "APK de teste recompilado do commit c5baa07cded69b0084146435422aac3fcf881274. Compilação isolada, sem alterar o código-fonte solicitado. A verificação de sprites separada foi ignorada." \
            --prerelease
