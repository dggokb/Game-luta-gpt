name: Build Game Luta APK

# CI never writes to the repository: generated sprite outputs are the author's
# responsibility (build_characters.py --write) and are only verified here.
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - game-luta-sprite-gpt
      - game-luta-sprite-astra
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR makes the running build obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install sprite pipeline dependency
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt

      # Processed atlases from earlier runs. Entries are keyed by the hash of their own
      # inputs (build_characters.py), so a restored entry is only used when identical; an
      # older cache still serves every clip that did not change.
      - name: Restore sprite atlas cache
        id: sprite-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/sprite-cache
          key: sprite-cache-v1-${{ hashFiles('art/sprites/source/**', 'tools/sprites/clips/**', 'tools/sprites/profiles/**', 'tools/sprites/*.py', 'tools/sprites/tests/**', 'tools/sprites/requirements.txt') }}
          restore-keys: sprite-cache-v1-
      - name: Mark sprite cache start
        run: touch "$RUNNER_TEMP/sprite-cache-start"

      - name: Normalize and validate sprite assets
        run: |
          python3 -m unittest discover -s tools/sprites/tests -v
          python3 tools/sprites/build_characters.py --check

      # Diagnostic only: shows the author what --write would produce. Nothing is committed.
      - name: Materialize generated sprite outputs after stale check
        if: failure()
        run: python3 tools/sprites/build_characters.py --write

      - name: Upload generated sprite outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sprite-GPT-Generated-Outputs
          path: |
            android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java
            android/app/src/main/java/com/gamelutagpt/GeneratedSpriteLayouts.java
            android/app/src/main/java/com/gamelutagpt/SpriteStates.java
            android/app/src/main/res/drawable-nodpi/*.webp
            tools/sprites/reports/*.report.json
          if-no-files-found: warn

      - name: Build debug APK
        working-directory: android
        run: gradle testDebugUnitTest :ultra-core:test :stage-core:test :story-core:test assembleDebug -PrequireSpriteCheck=true --stacktrace

      # Saved even when a check fails: the atlases already processed stay valid.
      - name: Drop sprite cache entries this run did not use
        if: always() && steps.sprite-cache.outputs.cache-hit != 'true'
        run: |
          test -d android/app/build/sprite-cache || exit 0
          find android/app/build/sprite-cache -mindepth 1 -maxdepth 1 ! -newer "$RUNNER_TEMP/sprite-cache-start" -exec rm -rf {} +
          du -sh android/app/build/sprite-cache
      - name: Save sprite atlas cache
        if: always() && steps.sprite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/build/sprite-cache
          key: ${{ steps.sprite-cache.outputs.cache-primary-key }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameLutaGPT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Without KVM the emulator runs in software and takes ~15 min just to boot.
      - name: Enable emulator hardware acceleration
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test on Android emulator
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.gamelutagpt
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 5
            adb shell input keyevent KEYCODE_HOME
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 2
            adb shell pidof com.gamelutagpt | grep -E '[0-9]+'
            ! adb logcat -d -v brief | grep -q "Process: com.gamelutagpt"
            adb exec-out screencap -p > game-smoke.png
            test -s game-smoke.png

      - name: Upload runtime screenshot
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        uses: actions/upload-artifact@v4
        with:
          name: GameLutaGPT-Smoke-Screenshot
          path: game-smoke.png
          if-no-files-found: error


      - name: Upload sprite review and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sprite-GPT-Validation
          path: |
            android/app/build/sprite-review/
            android/app/build/reports/tests/
