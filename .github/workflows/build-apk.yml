name: Capture Sprite Reports

on:
  push:
    branches:
      - game-luta-sprite-gpt

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install sprite pipeline dependency
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Generate and validate sprite packs
        run: |
          python3 -m unittest discover -s tools/sprites/tests -v
          python3 tools/sprites/build_characters.py --write
      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: Sprite-GPT-Generated-Reports
          path: tools/sprites/reports/
          if-no-files-found: error
