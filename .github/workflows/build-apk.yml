name: Build Game Luta APK

# CI never writes to the code: generated sprite outputs are the author's responsibility
# (build_characters.py --write) and are only verified here. The only write is publishing the
# APK and the smoke screenshot to the rolling release "build-<branch>" (job-level permissions).
# Artefatos do Actions contam na cota de armazenamento (0,5 GB no plano): só sobem diagnósticos
# quando algo falha, e por 1 dia.
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - game-luta-sprite-gpt
      - game-luta-sprite-astra
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR makes the running build obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Só o APK, sem os testes: sai em poucos minutos para instalar e testar no celular. É o único
  # job que roda a cada push: o repositório é privado e a cota de minutos do Actions acaba
  # rápido. Os testes (job "build") rodam no PR e no botão "Run workflow".
  apk:
    name: APK (rápido, sem testes)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # Python + Pillow: a calibração do P01 é gerada no build.
      - name: Install sprite pipeline dependency
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt

      # Sem verifySpritePacks: a conferência das folhas (a parte demorada) fica no job de testes.
      - name: Build debug APK (sem testes)
        working-directory: android
        run: gradle assembleDebug -x verifySpritePacks --stacktrace

      # O APK vai para a release "build-<branch>" (substituído a cada push): abre no celular em
      # Releases e instala direto. Release não conta na cota de armazenamento do Actions.
      - name: Nome do APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/GameLutaGPT.apk"
      - name: Publicar APK na release da branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publicar-build.sh '' "$RUNNER_TEMP/GameLutaGPT.apk"
      # PR não pode escrever releases: o APK fica como artefato por 1 dia.
      - name: Upload APK (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/GameLutaGPT.apk
          archive: false
          if-no-files-found: error
          retention-days: 1

  build:
    name: Testes, folhas e smoke no emulador
    # ~25 min por execução: fora do push (cota de minutos); no PR e no "Run workflow".
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install sprite pipeline dependency
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt

      # Processed atlases from earlier runs. Entries are keyed by the hash of their own
      # inputs (build_characters.py), so a restored entry is only used when identical; an
      # older cache still serves every clip that did not change.
      - name: Restore sprite atlas cache
        id: sprite-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/sprite-cache
          key: sprite-cache-v1-${{ hashFiles('art/sprites/source/**', 'tools/sprites/clips/**', 'tools/sprites/profiles/**', 'tools/sprites/*.py', 'tools/sprites/tests/**', 'tools/sprites/requirements.txt') }}
          restore-keys: sprite-cache-v1-
      - name: Mark sprite cache start
        run: touch "$RUNNER_TEMP/sprite-cache-start"

      - name: Normalize and validate sprite assets
        run: |
          python3 -m unittest discover -s tools/sprites/tests -v
          python3 tools/sprites/build_characters.py --check

      # Diagnostic only: shows the author what --write would produce. Nothing is committed.
      - name: Materialize generated sprite outputs after stale check
        if: failure()
        run: python3 tools/sprites/build_characters.py --write

      # Só quando a conferência falha (é o que o --write acima gera); ~0,5 GB, por isso 1 dia.
      - name: Upload generated sprite outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sprite-GPT-Generated-Outputs
          retention-days: 1
          path: |
            android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java
            android/app/src/main/java/com/gamelutagpt/GeneratedSpriteLayouts.java
            android/app/src/main/java/com/gamelutagpt/SpriteStates.java
            android/app/src/main/res/drawable-nodpi/*.webp
            tools/sprites/reports/*.report.json
          if-no-files-found: warn

      - name: Tests and debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest :ultra-core:test :stage-core:test :story-core:test :motion-core:test assembleDebug -PrequireSpriteCheck=true --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-apk.log"

      # Falhou: cada teste que caiu e o "What went wrong" do Gradle viram anotações do job, que
      # dá para ler pela API do GitHub (sem baixar o log inteiro).
      - name: Report build failures as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          def clean(text):
              return re.sub(r'\s+', ' ', text or '').strip()[:400]
          for path in glob.glob('android/**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      msg = clean(bad.get('message') or (bad.text or '').splitlines()[0] if (bad.get('message') or bad.text) else '')
                      print(f"::error title=Teste {case.get('classname')}.{case.get('name')}::{msg}")
          log = os.path.join(os.environ.get('RUNNER_TEMP', '.'), 'gradle-apk.log')
          if os.path.exists(log):
              lines = open(log, encoding='utf-8', errors='replace').read().splitlines()
              for i, line in enumerate(lines):
                  if 'What went wrong' in line or re.search(r'\.java:\d+: error', line):
                      print('::error title=Gradle::' + clean(' '.join(lines[i:i + 4])))
          PY

      # Saved even when a check fails: the atlases already processed stay valid.
      - name: Drop sprite cache entries this run did not use
        if: always() && steps.sprite-cache.outputs.cache-hit != 'true'
        run: |
          test -d android/app/build/sprite-cache || exit 0
          find android/app/build/sprite-cache -mindepth 1 -maxdepth 1 ! -newer "$RUNNER_TEMP/sprite-cache-start" -exec rm -rf {} +
          du -sh android/app/build/sprite-cache
      - name: Save sprite atlas cache
        if: always() && steps.sprite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/build/sprite-cache
          key: ${{ steps.sprite-cache.outputs.cache-primary-key }}

      # O APK para baixar sai do job "apk" (rápido); este aqui monta o seu só para o smoke.
      # Without KVM the emulator runs in software and takes ~15 min just to boot.
      - name: Enable emulator hardware acceleration
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test on Android emulator
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.gamelutagpt
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 5
            adb shell input keyevent KEYCODE_HOME
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 2
            adb shell pidof com.gamelutagpt | grep -E '[0-9]+'
            ! adb logcat -d -v brief | grep -q "Process: com.gamelutagpt"
            adb exec-out screencap -p > game-smoke.png
            test -s game-smoke.png

      - name: Publicar captura do smoke na release da branch
        if: github.ref == 'refs/heads/game-luta-sprite-gpt' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publicar-build.sh '' game-smoke.png


      # ~1,2 GB: só quando algo falha, e por 1 dia.
      - name: Upload sprite review and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sprite-GPT-Validation
          retention-days: 1
          path: |
            android/app/build/sprite-review/
            android/app/build/reports/tests/
