name: Publish direct APK from completed build
permissions:
  contents: write
on:
  push:
    branches:
      - 'claude/apk-ccr-4434da12-5490pk-20261013'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download validated APK artifact from successful run
        uses: actions/download-artifact@v4
        with:
          name: GameLutaGPT-APK-ccr-4434da12-5490pk
          repository: dggokb/Game-luta-gpt
          run-id: 38396921743
          github-token: ${{ github.token }}
          path: release-files
      - name: Inspect APK
        run: |
          find release-files -maxdepth 3 -type f -printf '%p %s bytes\n'
          test -s release-files/app-debug.apk
          file release-files/app-debug.apk
          mv release-files/app-debug.apk release-files/GameLutaGPT-ccr-4434da12-5490pk.apk
      - name: Publish APK as direct-download GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-ccr-4434da12-5490pk-20261013" \
            "release-files/GameLutaGPT-ccr-4434da12-5490pk.apk" \
            --repo "${{ github.repository }}" \
            --target "66c3c0a728f7541fa2cd8879b0cdbd745d229367" \
            --title "APK da branch ccr-4434da12-5490pk (13/10/2026)" \
            --notes "APK de teste compilado do snapshot 66c3c0a728f7541fa2cd8879b0cdbd745d229367. Compilação isolada com validação antiga de sprites ignorada e visibilidade dos campos SKIP_* corrigida apenas em workspace; branch de origem não foi modificada." \
            --prerelease
