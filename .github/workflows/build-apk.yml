name: Publish direct APK for game-luta-sprite-gpt (2af6b80)
permissions:
  contents: write
on:
  push:
    branches:
      - 'claude/apk-game-luta-sprite-gpt-20261013'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout game source snapshot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Python sprite tooling
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Assemble APK without separate slow sprite validation
        working-directory: android
        run: gradle :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - name: Verify APK and prepare release asset
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/GameLutaGPT-game-luta-sprite-gpt-2af6b80.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-game-luta-sprite-gpt-2af6b80-20261013" \
            "release-files/GameLutaGPT-game-luta-sprite-gpt-2af6b80.apk" \
            --repo "${{ github.repository }}" \
            --target "2af6b80e58cfc8cea47c4b239174657901b5feb7" \
            --title "APK game-luta-sprite-gpt (2af6b80)" \
            --notes "APK debug compilado a partir do HEAD 2af6b80e58cfc8cea47c4b239174657901b5feb7. Código-fonte original preservado. Build temporário ignora apenas a validação de sprites, sem alterar os sprites." \
            --prerelease
