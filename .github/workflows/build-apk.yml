name: Build and publish direct APK from eed9244
permissions:
  contents: write
on:
  push:
    branches:
      - 'claude/apk-game-luta-sprite-gpt-eed9244-20261013'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Pillow and sprite tools
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Assemble APK without separate sprite validation
        working-directory: android
        run: gradle :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - name: Verify APK and prepare direct download
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/GameLutaGPT-game-luta-sprite-gpt-eed9244.apk
      - name: Publish APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-game-luta-sprite-gpt-eed9244-20261013" \
            "release-files/GameLutaGPT-game-luta-sprite-gpt-eed9244.apk" \
            --repo "${{ github.repository }}" \
            --target "eed92442171d11d259ea59311e0e0789a772c9d7" \
            --title "APK game-luta-sprite-gpt (eed9244)" \
            --notes "APK debug compilado a partir do commit eed92442171d11d259ea59311e0e0789a772c9d7. Branch de origem preservada. Verificação separada de sprites ignorada nesta compilação isolada." \
            --prerelease
