name: Build and publish APK for sprite-gpt 9f260ec
permissions:
  contents: write
on:
  push:
    branches:
      - 'claude/apk-game-luta-sprite-gpt-9f260ec-20261013'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install sprite dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Assemble APK without separate sprite validation
        working-directory: android
        run: gradle :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - name: Verify APK and prepare asset
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/GameLutaGPT-game-luta-sprite-gpt-9f260ec.apk
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-game-luta-sprite-gpt-9f260ec-20261013" \
            "release-files/GameLutaGPT-game-luta-sprite-gpt-9f260ec.apk" \
            --repo "${{ github.repository }}" \
            --target "9f260ec8b699e328c3575704099456d1a78403f7" \
            --title "APK game-luta-sprite-gpt (9f260ec)" \
            --notes "APK debug compilado do commit 9f260ec8b699e328c3575704099456d1a78403f7. Branch original preservada. A verificação separada de sprites não foi executada neste build." \
            --prerelease
