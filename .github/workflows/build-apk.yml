name: Build and publish APK for sprite-gpt e9ef97a
permissions:
  contents: write
on:
  push:
    branches:
      - 'claude/apk-game-luta-sprite-gpt-e9ef97a-20261014'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install sprite dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Assemble APK without separate sprite validation
        working-directory: android
        run: gradle :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - name: Verify APK and prepare asset
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/GameLutaGPT-game-luta-sprite-gpt-e9ef97a.apk
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-game-luta-sprite-gpt-e9ef97a-20261014" \
            "release-files/GameLutaGPT-game-luta-sprite-gpt-e9ef97a.apk" \
            --repo "${{ github.repository }}" \
            --target "e9ef97a995be0041fb93e93bbc8d6a00103f4c8f" \
            --title "APK game-luta-sprite-gpt (e9ef97a)" \
            --notes "APK debug compilado do commit e9ef97a995be0041fb93e93bbc8d6a00103f4c8f. Branch original preservada. A verificação separada dos sprites foi ignorada." \
            --prerelease
