name: Build Game Luta APK

# APK builds use the versioned sprite outputs. Full animation validation remains
# available through tools/sprites/tests and build_characters.py --check, separately.
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - game-luta-sprite-gpt
      - teste-de-sprites-gpt
      - game-luta-sprite-astra
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR makes the running build obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install P01 calibration dependency
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest :ultra-core:test :stage-core:test :story-core:test assembleDebug -x :app:verifySpritePacks --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-apk.log"

      # Falhou: cada teste que caiu e o "What went wrong" do Gradle viram anotações do job, que
      # dá para ler pela API do GitHub (sem baixar o log inteiro).
      - name: Report build failures as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          def clean(text):
              return re.sub(r'\s+', ' ', text or '').strip()[:400]
          for path in glob.glob('android/**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      msg = clean(bad.get('message') or (bad.text or '').splitlines()[0] if (bad.get('message') or bad.text) else '')
                      print(f"::error title=Teste {case.get('classname')}.{case.get('name')}::{msg}")
          log = os.path.join(os.environ.get('RUNNER_TEMP', '.'), 'gradle-apk.log')
          if os.path.exists(log):
              lines = open(log, encoding='utf-8', errors='replace').read().splitlines()
              for i, line in enumerate(lines):
                  if 'What went wrong' in line or re.search(r'\.java:\d+: error', line):
                      print('::error title=Gradle::' + clean(' '.join(lines[i:i + 4])))
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameLutaGPT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Without KVM the emulator runs in software and takes ~15 min just to boot.
      - name: Enable emulator hardware acceleration
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test on Android emulator
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.gamelutagpt
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 5
            adb shell input keyevent KEYCODE_HOME
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 2
            adb shell pidof com.gamelutagpt | grep -E '[0-9]+'
            ! adb logcat -d -v brief | grep -q "Process: com.gamelutagpt"
            adb exec-out screencap -p > game-smoke.png
            test -s game-smoke.png

      - name: Upload runtime screenshot
        if: github.ref == 'refs/heads/game-luta-sprite-gpt'
        uses: actions/upload-artifact@v4
        with:
          name: GameLutaGPT-Smoke-Screenshot
          path: game-smoke.png
          if-no-files-found: error


      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameLutaGPT-Test-Reports
          path: |
            android/app/build/reports/tests/
