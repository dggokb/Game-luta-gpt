name: Validate approved HUD integration
on:
  push:
    branches: ['integracao/hud-efeitos-aprovados-20261012']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Validate HUD with the destination selection and compile APK
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests '*HudArtTest' --tests '*HudEffectsTest' --tests '*ExtractedSystemsTest' --tests '*CharacterSelect*Test' --tests '*SpriteIntegrationTest.lifeButtonsRefillTheTeamAndTheCpuWithoutRestarting' :ultra-core:test :stage-core:test :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUD-integrated-validation
          path: |
            android/app/build/reports/tests/
            android/app/build/outputs/apk/debug/app-debug.apk
