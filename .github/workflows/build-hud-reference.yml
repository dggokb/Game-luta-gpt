name: HUD reference APK
on:
  push:
    branches: ['ui/hud-barras-referencia-20261012']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      # HUD-only change: existing sprite assets are untouched.
      - name: Compile, run game tests and build APK
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests '*ExtractedSystemsTest' --tests '*CharacterSelectTest' --tests '*SpriteIntegrationTest.lifeButtonsRefillTheTeamAndTheCpuWithoutRestarting' :ultra-core:test :stage-core:test :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GameLutaGPT-HUD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Capture actual HUD on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 10
            adb shell pidof com.gamelutagpt
            adb exec-out screencap -p > hud-reference.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUD-validation
          path: |
            hud-reference.png
            android/app/build/reports/tests/
