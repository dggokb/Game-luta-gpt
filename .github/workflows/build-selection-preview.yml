name: Build Character Selection Preview

# Isolated UI smoke build. The original, full sprite-validation workflow stays unchanged.
on:
  push:
    branches:
      - game-luta-sprite-gpt
    paths:
      - '.github/workflows/build-selection-preview.yml'
      - 'android/app/src/main/java/com/gamelutagpt/CharacterSelect.java'
      - 'android/app/src/main/java/com/gamelutagpt/CharacterSelectRenderer.java'
      - 'android/app/src/main/java/com/gamelutagpt/GameView.java'
      - 'android/app/src/test/java/com/gamelutagpt/CharacterSelectTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Sprite generator requirements for build checks
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Test selection and assemble APK
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests '*CharacterSelectTest' :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: GameLuta-Selecao-TAG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Smoke test selector launch and capture image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 8
            adb shell pidof com.gamelutagpt | grep -E '[0-9]+'
            ! adb logcat -d -v brief | grep -q 'FATAL EXCEPTION'
            adb exec-out screencap -p > selection-smoke.png
            test -s selection-smoke.png
      - name: Screenshot from Android emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameLuta-Selecao-TAG-Screenshot
          path: selection-smoke.png
          if-no-files-found: ignore
