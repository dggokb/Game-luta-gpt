name: Build Character Selection Preview

# Isolated UI smoke build. The original, full sprite-validation workflow stays unchanged.
# Só no botão "Run workflow" (cota de minutos do Actions no repositório privado).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Sprite generator requirements for build checks
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Test selection and assemble APK
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests '*CharacterSelectTest' :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      # O APK já sai como asset da release (último passo); artefato duplicaria ~0,8 GB na cota.
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test selector launch and capture image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 8
            adb shell pidof com.gamelutagpt | grep -E '[0-9]+'
            ! adb logcat -d -v brief | grep -q 'FATAL EXCEPTION'
            adb exec-out screencap -p > selection-smoke.png
            test -s selection-smoke.png
      - name: Screenshot from Android emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameLuta-Selecao-TAG-Screenshot
          path: selection-smoke.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Publish validated APK as direct GitHub release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tag-select-${GITHUB_SHA:0:12}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk#GameLuta-Selecao-TAG.apk \
            --target "$GITHUB_SHA" \
            --title "Seleção TAG - teste ${GITHUB_SHA:0:12}" \
            --notes "APK de teste da tela de seleção TAG. Branch game-luta-sprite-gpt. Compilação e smoke test passaram." \
            --prerelease
      - name: Export small visual QA preview to build log
        if: always()
        run: |
          if test -s selection-smoke.png; then
            python3 - <<'PY'
          from PIL import Image
          import base64
          image = Image.open("selection-smoke.png").convert("RGB")
          image.thumbnail((960,540))
          image.save("/tmp/selection-preview.jpg", "JPEG", quality=64)
          encoded = base64.b64encode(open("/tmp/selection-preview.jpg","rb").read()).decode()
          print("BEGIN_SELECTION_PREVIEW_JPEG")
          print(encoded)
          print("END_SELECTION_PREVIEW_JPEG")
          PY
          fi
