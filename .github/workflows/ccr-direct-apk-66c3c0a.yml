name: Direct APK CCR 66c3c0a
on:
  push:
    branches: ['apk-export-ccr-66c3c0a']
    paths: ['.github/workflows/ccr-direct-apk-66c3c0a.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact game source and isolated workflow
        run: |
          test "$(git merge-base --is-ancestor 66c3c0a728f7541fa2cd8879b0cdbd745d229367 HEAD; echo $?)" = "0"
          test "$(git diff --name-only 66c3c0a728f7541fa2cd8879b0cdbd745d229367 HEAD)" = ".github/workflows/ccr-direct-apk-66c3c0a.yml"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android Platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install sprite validation dependency
        run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Normalize generated sprite metadata inside checkout
        run: |
          python3 tools/sprites/build_characters.py --write
          python3 tools/sprites/build_characters.py --check
      - name: Correct story skip-button constant visibility in disposable checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/story-core/src/main/java/com/gamelutagpt/historia/PaginaHistoria.java')
          old='    static final float SKIP_LEFT = 1132f, SKIP_TOP = 0f, SKIP_RIGHT = 1270f, SKIP_BOTTOM = 34f;'
          new=old.replace('    static final float ', '    public static final float ')
          content=p.read_text()
          assert content.count(old)==1, 'Expected exact source declaration not found'
          p.write_text(content.replace(old,new))
          print('Applied Java visibility fix to temporary checkout only')
          PY
      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK content and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          src=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert src.exists() and src.stat().st_size>100_000_000
          with ZipFile(src) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'classes.dex' in z.namelist()
          target=Path('GameLutaGPT-CCR-66c3c0a.apk')
          src.rename(target)
          print('APK verified:',target.stat().st_size,'bytes')
          PY
      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="apk-ccr-66c3c0a"
          name="GameLutaGPT-CCR-66c3c0a.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$name" --clobber
          else
            gh release create "$tag" "$name" --target 66c3c0a728f7541fa2cd8879b0cdbd745d229367 --title "CCR APK 66c3c0a" --notes "APK direto (sem ZIP), criado a partir do commit 66c3c0a728f7541fa2cd8879b0cdbd745d229367 da branch ccr-4434da12-5490pk. Ajustes de metadados gerados feitos somente durante o build." --prerelease
          fi
