name: Fast PC Port

on:
  push:
    branches:
      - game-luta-pc-export-engine-gpt
    paths:
      - '.github/workflows/export-pc-fast.yml'

permissions:
  contents: read

jobs:
  port-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout PC engine
        uses: actions/checkout@v4
        with:
          ref: game-luta-pc-export-engine-gpt

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve mobile revision
        id: request
        shell: pwsh
        run: |
          $request = Get-Content 'tools/pc-export/export-request.json' -Raw | ConvertFrom-Json
          "source_branch=$($request.source_branch)" >> $env:GITHUB_OUTPUT
          "source_ref=$($request.source_sha)" >> $env:GITHUB_OUTPUT

      - name: Checkout mobile source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_ref }}
          path: mobile-source

      - name: Compile desktop port
        shell: pwsh
        run: |
          $env:GAME_LUTA_SOURCE_ROOT = "$env:GITHUB_WORKSPACE/mobile-source"
          gradle -p pc clean jar --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pc/build/package | Out-Null
          jpackage --type app-image --name GameLutaSpriteGPT --input pc/build/libs --main-jar game-luta-sprite-pc.jar --main-class com.gamelutagpt.DesktopLauncher --dest pc/build/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (git -C mobile-source rev-parse HEAD).Trim()
          Set-Content -Path pc/build/package/GameLutaSpriteGPT/EXPORT_INFO.txt -Value "Source: $sha"
          Compress-Archive -Path pc/build/package/GameLutaSpriteGPT -DestinationPath pc/build/GameLutaSpriteGPT-PC-fast.zip -Force

      - name: Upload Windows port
        uses: actions/upload-artifact@v4
        with:
          name: GameLutaSpriteGPT-PC-fast
          path: pc/build/GameLutaSpriteGPT-PC-fast.zip
          if-no-files-found: error
          retention-days: 30
