name: P01 fast integrate existing HD artifacts

on:
  push:
    branches:
      - test/p01-all-sr-20261009
    paths:
      - .github/workflows/p01-fast-integrate.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: p01-hd-fast-integrate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Cancel old 37-job pipeline without discarding completed HD assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api repos/dggokb/Game-luta-gpt/actions/runs/37983860825 --jq '.status')"
          echo "Old workflow status: $state"
          if [ "$state" = "in_progress" ] || [ "$state" = "queued" ] || [ "$state" = "waiting" ]; then
            gh api --method POST repos/dggokb/Game-luta-gpt/actions/runs/37983860825/cancel
            echo "Old pipeline cancellation requested"
          else
            echo "Old pipeline already completed, no cancel necessary"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only Pillow (no PyTorch or super-resolution repeat)
        run: python -m pip install --disable-pip-version-check "Pillow==12.3.0"
      - name: Reuse 37 finished HD animation artifacts from previous run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37983860825
          pattern: p01-player_base_*
          merge-multiple: true
          path: /tmp/p01-hd-outputs
      - name: Confirm that all 37 generated animations are present
        run: |
          test "$(find /tmp/p01-hd-outputs -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 37
          test "$(find /tmp/p01-hd-outputs -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 37
          python -m compileall -q tools/sprites/p01_sr_batch.py
      - name: Validate source hashes and alpha and rebuild only the changed P01 atlases
        run: |
          python -u tools/sprites/p01_sr_batch.py integrate --input-dir /tmp/p01-hd-outputs
          git diff --check
      - name: Verify all changed paths are P01 art, reports, or generated Java only
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines()
          allowed=('tools/sprites/clips/player_base_',
                   'art/sprites/source/player_base_',
                   'android/app/src/main/res/drawable-nodpi/player_base_',
                   'tools/sprites/reports/player_base_',
                   'android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java',
                   'android/app/src/main/java/com/gamelutagpt/GeneratedSpriteLayouts.java',
                   'android/app/src/main/java/com/gamelutagpt/SpriteStates.java',
                   'docs/art/p01-all-sr-results.json')
          for line in changed:
              name=line[3:]
              if not name.startswith(allowed):
                  raise SystemExit('Unexpected mutation outside P01: '+name)
          print('P01-only changes verified:',len(changed))
          PY
      - name: Commit finished HD assets to test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'tools/sprites/clips/player_base_*.json'
          git add -- 'art/sprites/source/player_base_*_sr_hd.png'
          git add -- 'android/app/src/main/res/drawable-nodpi/player_base_*.png'
          git add -- 'tools/sprites/reports/player_base_*.report.json'
          git add -- android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java
          git add -- android/app/src/main/java/com/gamelutagpt/GeneratedSpriteLayouts.java
          git add -- android/app/src/main/java/com/gamelutagpt/SpriteStates.java
          git add -- docs/art/p01-all-sr-results.json
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit; check results"; exit 1; }
          git commit -m "Integrate 37 improved P01 atlases with incremental validation [skip ci]"
          git push origin HEAD:test/p01-all-sr-20261009
      - name: Upload P01 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P01-Fast-Incremental-Validation
          path: |
            docs/art/p01-all-sr-results.json
            tools/sprites/reports/player_base_*.report.json
          if-no-files-found: warn
