name: P01 Motor V2 - APK Instalavel
on:
  push:
    branches: [teste-motor-sprite]
    paths:
      - '.github/workflows/p01-mobile-test-apk.yml'
      - 'android/app/src/main/java/com/gamelutagpt/SpriteMotion.java'
      - 'android/app/src/test/java/com/gamelutagpt/SpriteAnimationSyncTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p01-mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install platform and build-tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Image and sprite check dependencies
        run: python3 -m pip install -r tools/sprites/requirements.txt -r tools/sprites/requirements-animar.txt
      - name: Run P01 motor V2 checks on shipping assets
        run: |
          python3 -m unittest discover -s tools/sprites/tests -p test_sprite_auto_repair.py -v
          python3 -m unittest discover -s tools/sprites/tests -p test_autonomous_transitions.py -v
          python3 -m unittest discover -s tools/sprites/tests -p test_quality_guard.py -v
          python3 tools/sprites/quality_guard.py --character player_base --strict
          python3 tools/sprites/autonomous_transitions.py --character player_base --check --report android/app/build/p01-test-mobile/transitions.json
          python3 tools/sprites/build_characters.py --check
      - name: Compile P01 debug APK for physical Android phone
        working-directory: android
        run: gradle :app:assembleDebug -PrequireSpriteCheck=true --no-daemon --stacktrace
      - name: Validate APK archive and manifest
        run: |
          set -eu
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APK_SIGNER" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          du -h "$APK"
          sha256sum "$APK"
      - name: Upload directly installable P01 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P01-Motor-Sprite-V2-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Focused Java animation integration tests
        working-directory: android
        run: |
          gradle :app:testDebugUnitTest --tests com.gamelutagpt.SpriteTransitionPolicyTest --tests com.gamelutagpt.SpriteTransitionAlignmentTest --tests com.gamelutagpt.SpriteAnimationSyncTest --no-daemon --stacktrace
      - name: Enable emulator acceleration and reject unaccelerated boot
        run: |
          test -c /dev/kvm || { echo 'No /dev/kvm: emulator smoke cannot be trusted'; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Emulator first-launch smoke test
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            mkdir -p android/app/build/p01-test-mobile
            capture() {
              timeout 15s adb logcat -d -v time > android/app/build/p01-test-mobile/startup-logcat.txt || true
              timeout 15s adb shell dumpsys activity activities > android/app/build/p01-test-mobile/activities.txt || true
              timeout 15s adb exec-out screencap -p > p01-motor-v2-screen.png || true
              timeout 15s adb shell uiautomator dump /sdcard/window.xml || true
              timeout 15s adb shell cat /sdcard/window.xml > p01-motor-v2-ui.xml || true
            }
            trap capture EXIT
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.gamelutagpt/com.gamelutagpt.MainActivity
            sleep 12
            adb shell pidof com.gamelutagpt | grep -Eq '[0-9]+'
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | grep -q com.gamelutagpt
            ! adb logcat -d -v brief | grep -Eiq 'FATAL EXCEPTION|Process: com.gamelutagpt|ANR in com.gamelutagpt'
            adb shell uiautomator dump /sdcard/window.xml || true
            adb shell cat /sdcard/window.xml > p01-motor-v2-ui.xml || true
            ! grep -Eiq "isn.t responding|has stopped|System UI" p01-motor-v2-ui.xml
            adb exec-out screencap -p > p01-motor-v2-screen.png
            test -s p01-motor-v2-screen.png
            python3 - <<'PY'
            from PIL import Image
            import numpy as np
            a=np.asarray(Image.open("p01-motor-v2-screen.png").convert("RGB"))
            a=a[50:-50,50:-50,:]
            fraction=float(np.mean(a.max(2)-a.min(2)>48))
            print("Game screenshot colored-pixel fraction",round(fraction,3))
            assert fraction>.06, "Screenshot seems blank or monochrome ANR dialog, not the fighting game"
            PY
      - name: Show on-failure logs if collected
        if: always()
        run: |
          if test -s android/app/build/p01-test-mobile/startup-logcat.txt; then
            grep -E 'FATAL EXCEPTION|OutOfMemory|com.gamelutagpt|am_anr|ANR in|not responding' android/app/build/p01-test-mobile/startup-logcat.txt | tail -n 100 || true
          fi
      - name: Upload screenshot and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P01-Motor-V2-QA
          path: |
            p01-motor-v2-screen.png
            android/app/build/p01-test-mobile/
            android/app/build/quality-pc/player_base/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
