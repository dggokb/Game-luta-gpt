name: P01 attack atlas pixel repair
on:
  push:
    branches: [refino/p01-animacoes-20261009]
    paths:
      - tools/sprites/repair_p01_heavy_art.py
      - tools/sprites/repair_p01_crouch_heavy.py
      - .github/workflows/p01-repair-heavy.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Repair enclosed leg transparency
        run: python tools/sprites/repair_p01_heavy_art.py --apply
      - name: Repair broken P01 2H trouser frame
        run: python tools/sprites/repair_p01_crouch_heavy.py --apply
      - name: Save repaired attack atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/drawable-nodpi/player_base_heavy_straight.png
          git add android/app/src/main/res/drawable-nodpi/player_base_crouch_heavy.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(p01): repair H and crouch-heavy atlas artifacts"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No attack atlas repair needed; no binary changes made."
          fi
