name: P01 Motor V2 Apply Timing Sandbox
on:
  push:
    branches: [teste-motor-sprite]
    paths: ['.github/workflows/p01-retime-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p01-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sprite tooling
        run: python -m pip install -r tools/sprites/requirements.txt -r tools/sprites/requirements-animar.txt
      - name: Apply safe P01 visual timings to sandbox checkout
        run: |
          python tools/sprites/motion_harmony.py --character player_base --apply-visual-timing --output android/app/build/p01-retime-sandbox/harmony.json
          python tools/sprites/build_characters.py --check
          git diff --stat
          git diff -- characters/player_base/character.json android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java > android/app/build/p01-retime-sandbox/DIFF.patch
      - name: Ensure p01 source sprites not rewritten
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed, 'No retiming applied; inspect suggestions'
          assert all(x in ['characters/player_base/character.json','android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java'] for x in changed), changed
          print('ONLY TIMING FILES CHANGED:', changed)
          PY
      - name: Upload exact retimed P01 and generated Java files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P01-Safe-Retime-Sandbox
          path: |
            android/app/build/p01-retime-sandbox/
            characters/player_base/character.json
            android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java
          retention-days: 30
