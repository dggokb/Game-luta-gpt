name: P01 VICTORY real atlas evidence
on:
  push:
    branches:
      - refino/p01-animacoes-20261009
    paths:
      - .github/workflows/p01-victory-evidence.yml
      - tools/sprites/validar_p01_victory_real.py
      - tools/sprites/generate_p01_calibration.py
      - android/app/src/main/assets/sprite-autofix.json
      - android/app/src/main/res/drawable-nodpi/player_base_victory.png
      - tools/sprites/reports/player_base_victory.report.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-p01-victory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image readers
        run: python -m pip install Pillow
      - name: Measure integrated P01/VICTORY atlas
        run: python tools/sprites/validar_p01_victory_real.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p01-victory-real-atlas-evidence
          path: android/app/build/sprite-review/p01-victory-real/*
          if-no-files-found: warn
