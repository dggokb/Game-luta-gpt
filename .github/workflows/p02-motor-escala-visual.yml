name: P02 - Original Video Cycle / Experimental APK
on:
  push:
    branches:
      - 'refino/motor-escala-visual-p02-20261011'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild-original-dash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install Pillow==12.3.0 numpy opencv-python-headless
      - name: Rebuild original input video, no external video synthesis
        run: |
          cat tools/sprites/video_sources/p02_dash_original.part* > "$RUNNER_TEMP/p02_dash.mp4"
          test -s "$RUNNER_TEMP/p02_dash.mp4"
          python -c 'import cv2,sys; c=cv2.VideoCapture(sys.argv[1]); print("original-video",c.get(cv2.CAP_PROP_FRAME_COUNT),c.get(cv2.CAP_PROP_FRAME_WIDTH),c.get(cv2.CAP_PROP_FRAME_HEIGHT)); assert c.isOpened()' "$RUNNER_TEMP/p02_dash.mp4"
      - name: Select chronological run cycle and normalize optical size once
        run: |
          python tools/sprites/refinar_ciclo_video.py --video "$RUNNER_TEMP/p02_dash.mp4" --character p02 --clip p02_dash
          python tools/sprites/build_characters.py --write
      - name: Ensure approved IDLE/P01/movement physics have not changed
        run: |
          git diff --exit-code 826d1cd45d8dbe34ae425b79a1fc4ed2e666cc1c HEAD -- \
            android/app/src/main/res/drawable-nodpi/p02_idle.png \
            art/sprites/source/p02_idle_sr_2x.png \
            'android/app/src/main/res/drawable-nodpi/player_base_*.png' \
            characters/player_base \
            android/app/src/main/java/com/gamelutagpt/CombatEngine.java
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('characters/p02/character.json').read_text())
          assert c['animations']['IDLE']['frames']==list(range(15,45))
          assert c['animations']['IDLE']['durationsMs']==[41]*30
          d=c['animations']['DASH']
          assert d['loop'] and d['frames']==list(range(len(d['frames'])))
          assert 9<=len(d['frames'])<=16 and sum(d['durationsMs'])==260
          fix=json.loads(Path('android/app/src/main/assets/sprite-autofix.json').read_text())
          assert not any(x['character']=='p02' for x in fix['corrections'])
          PY
      - name: Real visual size / continuity regression and negative tests
        run: |
          python tools/sprites/validar_ciclo_video.py
          python -m unittest discover -s tools/sprites/tests -p test_verificar_frames.py -v
          python -m unittest discover -s tools/sprites/tests -p test_ciclo_video.py -v
      - name: Renderer-identical GIF evidence from the original and rebuilt atlases
        run: |
          git show 826d1cd45d8dbe34ae425b79a1fc4ed2e666cc1c:android/app/src/main/res/drawable-nodpi/p02_dash.png > "$RUNNER_TEMP/p02-dash-original.png"
          git show 826d1cd45d8dbe34ae425b79a1fc4ed2e666cc1c:tools/sprites/reports/p02_dash.report.json > "$RUNNER_TEMP/p02-dash-original.json"
          python tools/sprites/render_ciclo_video.py --before "$RUNNER_TEMP/p02-dash-original.png" --before-layout "$RUNNER_TEMP/p02-dash-original.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager "platforms;android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0" || sdkmanager "build-tools;35.0.0"
      - name: Android renderer checks and P01 regressions
        run: |
          cat >/tmp/extra-test-memory.gradle <<'GRADLE'
          allprojects { tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
            maxHeapSize = '4g'; maxParallelForks = 1
          }}
          GRADLE
          gradle -p android --no-daemon --max-workers=1 -I /tmp/extra-test-memory.gradle \
            :app:testDebugUnitTest \
            --tests com.gamelutagpt.P02DashRuntimeSizeTest \
            --tests com.gamelutagpt.P02IdleRuntimeFixTest \
            --tests com.gamelutagpt.SpriteAutoFixTest \
            --tests com.gamelutagpt.P01IntroRealAssetTest \
            --tests com.gamelutagpt.P01VictoryRealAssetTest \
            -x :app:verifySpritePacks
      - name: Build real experimental APK
        run: gradle -p android --no-daemon :app:assembleDebug -x :app:verifySpritePacks
      - name: Verify exact PNG and Android asset in APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" res/drawable-nodpi-v4/p02_dash.png >/tmp/p02-packaged.png
          cmp /tmp/p02-packaged.png android/app/src/main/res/drawable-nodpi/p02_dash.png
          unzip -p "$APK" res/drawable-nodpi-v4/p02_idle.png >/tmp/p02-idle-published.png
          cmp /tmp/p02-idle-published.png android/app/src/main/res/drawable-nodpi/p02_idle.png
          unzip -p "$APK" assets/sprite-autofix.json >/tmp/packed-autofix.json
          cmp /tmp/packed-autofix.json android/app/src/main/assets/sprite-autofix.json
      - name: Persist generated sprites/manifest exclusively on experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/p02/character.json tools/sprites/clips/p02_dash.json \
            art/sprites/source/p02_dash_sr_hd.png \
            android/app/src/main/res/drawable-nodpi/p02_dash.png \
            android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java \
            android/app/src/main/java/com/gamelutagpt/GeneratedSpriteLayouts.java \
            tools/sprites/reports/p02_dash.report.json \
            tools/sprites/reports/p02_dash_cycle.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(p02): store verified chronological video dash cycle and optical scale"
            git push origin HEAD:refs/heads/refino/motor-escala-visual-p02-20261011
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p02-video-cycle-apk-and-gifs
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/sprite-review/p02-dash-cycle/
            tools/sprites/reports/p02_dash_cycle.json
            android/app/build/reports/tests/
          if-no-files-found: warn
      - name: Publish direct APK and GIFs from experimental branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="$(git rev-parse --short=8 HEAD)"
          TAG="p02-video-ciclo-$SHORT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/P02-DASH-ciclo-$SHORT.apk"
          gh release create "$TAG" "$RUNNER_TEMP/P02-DASH-ciclo-$SHORT.apk" \
            android/app/build/sprite-review/p02-dash-cycle/*.gif \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            --title "P02 DASH original-video natural cycle $SHORT" \
            --notes "Experimental P02 only; same total DASH duration, original approved IDLE and P01 unchanged. Run cycle recovered from video frames (no AI generation), uniform animation-level optical scaling. Requires visual approval; no merge." \
            --prerelease
