name: P09 and P12 pilots - character, audit and graphic SR

on:
  push:
    branches:
      - test/p09-three-engines-20261009
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p09-three-engines
  cancel-in-progress: true

jobs:
  p09-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install sprite validators and super-resolution dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
          python -m pip install --disable-pip-version-check "numpy<3" scipy opencv-python-headless
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Obtain exact approved AnimeVideo-v3 model
        run: |
          curl -fLS --retry 3 --output /tmp/realesr-animevideov3.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth
          echo "b8a8376811077954d82ca3fcf476f1ac3da3e8a68a4f4d71363008000a18b75d  /tmp/realesr-animevideov3.pth" | sha256sum --check
      - name: Create disposable P09 and P12 pilots from their own concept art
        run: |
          python -u tools/sprites/p09_three_engines_pilot.py prepare \
            --weights /tmp/realesr-animevideov3.pth
          python -u tools/sprites/p12_three_engines_pilot.py prepare \
            --weights /tmp/realesr-animevideov3.pth
          python -m compileall -q tools/sprites/p09_three_engines_pilot.py tools/sprites/p12_three_engines_pilot.py
      - name: Compile and validate all Character Packs including P09 and P12 fixtures
        run: |
          python tools/sprites/build_characters.py --write
          python tools/sprites/build_characters.py --check
          python -m unittest discover -s tools/sprites/tests -v
      - name: Audit P09 and P12 temporal harmony and collect all warnings
        run: |
          python -u tools/sprites/p09_three_engines_pilot.py audit
          python -u tools/sprites/p12_three_engines_pilot.py audit
      - name: Android unit tests and test APK
        working-directory: android
        run: gradle testDebugUnitTest :ultra-core:test :stage-core:test assembleDebug -PrequireSpriteCheck=true --stacktrace
      - name: Persist validated P09 and P12 assets in test branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- characters/p09/character.json characters/p12/character.json characters/roster.json
          git add -- tools/sprites/profiles/p09.json tools/sprites/profiles/p12.json
          git add -- tools/sprites/clips/p09_pilot_idle.json tools/sprites/clips/p12_pilot_idle.json
          git add -- art/sprites/source/p09_pilot_idle_original.png art/sprites/source/p09_pilot_idle_sr2x.png
          git add -- art/sprites/source/p12_pilot_idle_original.png art/sprites/source/p12_pilot_idle_sr2x.png
          git add -- tools/sprites/reports/p09_pilot_idle.report.json tools/sprites/reports/p12_pilot_idle.report.json
          git add -- android/app/src/main/res/drawable-nodpi/p09_pilot_idle.png android/app/src/main/res/drawable-nodpi/p12_pilot_idle.png
          git add -- android/app/src/main/java/com/gamelutagpt/GeneratedCharacters.java
          git add -- android/app/src/main/java/com/gamelutagpt/GeneratedSpriteLayouts.java
          git add -- android/app/src/main/java/com/gamelutagpt/SpriteStates.java
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Persist validated P09 and P12 three-engine test assets [skip ci]"
            git push origin HEAD:test/p09-three-engines-20261009
          fi
      - name: Upload P09 and P12 APK for manual test
        uses: actions/upload-artifact@v4
        with:
          name: P09-P12-three-engines-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source, enhanced frames, quality and unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P09-P12-three-engines-review
          path: |
            android/app/build/p09-pilot/
            android/app/build/p12-pilot/
            android/app/build/sprite-review/p09_pilot_idle.png
            android/app/build/sprite-review/p12_pilot_idle.png
            tools/sprites/reports/p09_pilot_idle.report.json
            tools/sprites/reports/p12_pilot_idle.report.json
            android/app/build/reports/tests/
          if-no-files-found: warn
