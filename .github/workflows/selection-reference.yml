name: Selection reference APK
on:
  push:
    branches: ['ui/selecao-concepts-fiel-20261012']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Test selection and build APK
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests '*CharacterSelectTest' :app:assembleDebug -x :app:verifySpritePacks --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GameLuta-Selecao-Fiel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify actual selection and TAG interaction
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: python3 tools/selection/emulator_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selection-reference-QA
          path: |
            selection-*.png
            android/app/build/reports/tests/
          if-no-files-found: warn
      - name: Publish tested APK and captures without ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GameLuta-Selecao.apk
          gh release create "selection-${GITHUB_SHA:0:12}" GameLuta-Selecao.apk selection-*.png selection-qa.json --target "$GITHUB_SHA" --title "Seleção concepts - ${GITHUB_SHA:0:12}" --notes "APK da branch ui/selecao-concepts-fiel-20261012. Testes de seleção e validação no emulador passaram." --prerelease
