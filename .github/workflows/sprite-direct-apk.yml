name: Sprite GPT Standalone APK
on:
  push:
    branches:
      - 'apk-export-sprite-55213ae'
    paths:
      - '.github/workflows/sprite-direct-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact game source commit
        run: |
          git merge-base --is-ancestor 55213ae8edbc03b11a6cf5c765dae085b0569ea0 HEAD
          test "$(git diff --name-only 55213ae8edbc03b11a6cf5c765dae085b0569ea0 HEAD)" = ".github/workflows/sprite-direct-apk.yml"
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Configure Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Verify and name standalone APK
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert p.is_file() and p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'classes.dex' in z.namelist()
          out=Path('GameLutaGPT-Sprite-GPT-55213ae.apk')
          p.rename(out)
          print('Verified APK size (bytes):',out.stat().st_size)
          PY
      - name: Publish direct .apk download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dggokb/Game-luta-gpt
        run: |
          tag="apk-sprite-gpt-55213ae"
          asset="GameLutaGPT-Sprite-GPT-55213ae.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target 55213ae8edbc03b11a6cf5c765dae085b0569ea0 --title "Sprite GPT Test APK (55213ae)" --notes "Android debug APK directly from game-luta-sprite-gpt commit 55213ae8edbc03b11a6cf5c765dae085b0569ea0. Standalone .apk, no ZIP."
          fi
