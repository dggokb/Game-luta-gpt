name: Sprite Drive inventory audit

on:
  push:
    branches:
      - test/sprite-inventory-drive-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolver regression tests
        run: python -m unittest discover -s tools/sprites/tests -p 'test_drive_inventory.py' -v
      - name: Drive snapshot x runtime report
        run: python tools/sprites/audit_drive_inventory.py
      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: sprite-drive-inventory
          path: android/app/build/sprite-audit/
