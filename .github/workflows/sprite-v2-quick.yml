name: Sprite V2 Quick Tests
on:
  push:
    branches: [teste-motor-sprite]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-sprite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python -m pip install -r tools/sprites/requirements.txt -r tools/sprites/requirements-animar.txt
      - name: Run isolated v2 tests
        run: |
          python -m unittest discover -s tools/sprites/tests -p test_sprite_auto_repair.py -v
          python -m unittest discover -s tools/sprites/tests -p test_video_quality.py -v
          python -m unittest discover -s tools/sprites/tests -p test_motion_harmony.py -v
      - name: Compile Python scripts
        run: python -m py_compile tools/sprites/video_quality.py tools/sprites/sprite_auto_repair.py tools/sprites/video_para_sprite.py tools/sprites/personagem.py tools/sprites/motion_harmony.py
