name: Testes do padronizador
on:
  push:
    branches: [padronizacao-sprites]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install -r requirements-review.txt -r requirements-dev.txt
      - name: Testes
        run: python -m unittest discover -s tests -v
