name: HUD visible runtime capture
on:
  push:
    branches: ['ui/hud-efeitos-barras-20261012']
    paths: ['.github/workflows/verify-hud-runtime.yml']
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Build only the touch test harness
        working-directory: android
        run: gradle :app:assembleDebugAndroidTest -x :app:verifySpritePacks
      - name: Download the exact already tested v0.102 APK
        uses: actions/download-artifact@v4
        with:
          name: HUD-effects-delivery
          run-id: 38270974931
          github-token: ${{ github.token }}
          path: installed-hud
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record the normal game loop without the Android fullscreen hint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            adb install -r installed-hud/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell wm size 1280x720
            adb shell screenrecord --time-limit 45 --bit-rate 3000000 /sdcard/hud-runtime.mp4 &
            adb shell am instrument -w -e class com.gamelutagpt.HudRuntimeTest com.gamelutagpt.test/androidx.test.runner.AndroidJUnitRunner > hud-runtime-result.txt
            adb shell pkill -2 screenrecord || true
            sleep 2
            adb pull /sdcard/hud-runtime.mp4 hud-runtime.mp4
            adb pull /sdcard/Android/data/com.gamelutagpt/files/ hud-runtime-captures
            cat hud-runtime-result.txt
            grep -q 'OK (1 test)' hud-runtime-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUD-visible-runtime-proof
          path: |
            hud-runtime.mp4
            hud-runtime-result.txt
            hud-runtime-captures/
