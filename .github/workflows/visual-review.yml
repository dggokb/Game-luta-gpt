name: Visual review (HUD, selection, effects)
on:
  push:
    branches: ['ccr-60181022-rh9cms']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Native Canvas tests and visual review frames
        working-directory: android
        run: >
          gradle :app:testDebugUnitTest
          --tests '*VisualReviewTest' --tests '*HudEffectsTest' --tests '*HudArtTest'
          --tests '*CharacterSelectTest' --tests '*ExtractedSystemsTest' --tests '*CameraRigRoundEndTest'
          :app:assembleDebug -x :app:verifySpritePacks --stacktrace --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: |
            android/app/build/visual-review/
            android/app/build/hud-review.png
            android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: visual-review-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
