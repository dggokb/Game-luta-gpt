name: Visual review (HUD, selection, effects)
on:
  push:
    branches: ['ccr-60181022-rh9cms']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 -m pip install --disable-pip-version-check -r tools/sprites/requirements.txt
      - name: Native Canvas tests and visual review frames
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest \
            --tests '*VisualReviewTest' --tests '*HudEffectsTest' --tests '*HudArtTest' \
            --tests '*CharacterSelectTest' --tests '*ExtractedSystemsTest' --tests '*CameraRigRoundEndTest' \
            :app:assembleDebug -x :app:verifySpritePacks --continue 2>&1 | tee /tmp/gradle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: visual-review-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish review images to the visual-review-rh9cms branch
        if: always()
        env:
          SHA: ${{ github.sha }}
        run: |
          python3 tools/visual_review_sheets.py android/app/build/visual-review /tmp/review
          cp -r android/app/build/reports/tests/testDebugUnitTest /tmp/review/test-report 2>/dev/null || true
          grep -E "error:|warning: \[|FAILED|tests completed|BUILD|What went wrong|Exception|at com\.gamelutagpt" /tmp/gradle.log | head -300 > /tmp/review/gradle-summary.txt || true
          tail -150 /tmp/gradle.log > /tmp/review/gradle-tail.txt || true
          cd /tmp/review
          git init -q -b visual-review-rh9cms
          git config user.name "visual-review-bot"
          git config user.email "visual-review-bot@users.noreply.github.com"
          echo "$SHA" > SOURCE_SHA
          git add -A && git commit -q -m "Visual review for $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" visual-review-rh9cms
