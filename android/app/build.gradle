plugins { id 'com.android.application' }

android {
    namespace 'com.gamelutagpt'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gamelutagpt.spriteastra'
        minSdk 24
        targetSdk 35
        versionCode 52
        versionName '0.52-sprite-astra-sync'
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
