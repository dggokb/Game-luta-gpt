plugins { id 'com.android.application' }

android {
    namespace 'com.gamelutagpt'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gamelutagpt.astra'
        minSdk 24
        targetSdk 35
        versionCode 46
        versionName '0.46-astra-prototype01-3d'
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
