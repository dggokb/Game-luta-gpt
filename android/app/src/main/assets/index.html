<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Game Luta GPT - Prototype</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;touch-action:none;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none}
  #game{display:block;width:100vw;height:100vh;touch-action:none}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#080b16;color:white;font-size:24px;padding:24px;z-index:20}
  @media (orientation:portrait){#rotate{display:flex}#game{visibility:hidden}}
</style>

<body>
<canvas id="game"></canvas>
<div id="rotate">Gire o celular para o modo paisagem para jogar.</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const V={w:1280,h:720,ground:565,left:70,right:1210};
let sx=1,sy=1,last=performance.now(),acc=0;
function resize(){canvas.width=Math.max(1,innerWidth*devicePixelRatio);canvas.height=Math.max(1,innerHeight*devicePixelRatio);sx=canvas.width/V.w;sy=canvas.height/V.h;}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.abs(a.x-b.x);
const rnd=(a,b)=>a+Math.random()*(b-a);
class Projectile{
  constructor(owner,x,y,dir){this.owner=owner;this.x=x;this.y=y;this.vx=dir*620;this.r=18;this.life=1.4;this.dead=false;}
  update(dt,enemy){this.x+=this.vx*dt;this.life-=dt;if(this.life<=0||this.x<V.left-50||this.x>V.right+50)this.dead=true;
    if(!this.dead&&Math.abs(this.x-enemy.x)<enemy.w*.55&&Math.abs(this.y-(enemy.y-enemy.h*.55))<enemy.h*.45){hit(this.owner,enemy,360,210,this.vx>0?1:-1,'ki');this.dead=true;}}
  draw(){ctx.save();ctx.shadowBlur=24;ctx.shadowColor='#8de3ff';ctx.fillStyle='#bdeeff';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.r*.42,0,Math.PI*2);ctx.fill();ctx.restore();}
}
class Fighter{
 constructor(name,isAI,x,teamSide){
  this.name=name;this.ai=isAI;this.teamSide=teamSide;this.x=x;this.y=V.ground;this.vx=0;this.vy=0;this.w=70;this.h=150;this.face=teamSide===0?1:-1;
  this.team=[10000,10000,10000];this.blue=[0,0,0];this.active=0;this.ki=0;this.sparking=false;this.sparkTime=0;this.sparkUsed=false;this.limitBreak=false;
  this.attackT=0;this.attackKind='';this.attackDone=false;this.hitstun=0;this.blockstun=0;this.invuln=0;this.dashT=0;this.superDash=false;this.sdT=0;this.airOption=true;
  this.block=false;this.charge=false;this.combo=0;this.comboT=0;this.assistT=0;this.assistX=0;this.tagLock=0;this.flash=0;this.koDelay=0;this.deadAll=false;
 }
 get hp(){return this.team[this.active]} set hp(v){this.team[this.active]=clamp(v,0,10000)}
 get rec(){return this.blue[this.active]} set rec(v){this.blue[this.active]=clamp(v,0,10000-this.hp)}
 aliveCount(){return this.team.filter(x=>x>0).length}
 onGround(){return this.y>=V.ground-.1}
 update(dt,enemy){
  this.face=enemy.x>=this.x?1:-1;
  this.flash=Math.max(0,this.flash-dt);this.invuln=Math.max(0,this.invuln-dt);this.hitstun=Math.max(0,this.hitstun-dt);this.blockstun=Math.max(0,this.blockstun-dt);this.tagLock=Math.max(0,this.tagLock-dt);this.comboT-=dt;if(this.comboT<=0)this.combo=0;
  if(this.sparking){this.sparkTime-=dt;this.hp=Math.min(10000,this.hp+45*dt);if(this.rec>0){let r=Math.min(this.rec,130*dt);this.hp+=r;this.rec-=r;}if(this.sparkTime<=0)this.sparking=false;}
  this.limitBreak=this.aliveCount()===1;
  for(let i=0;i<3;i++) if(i!==this.active&&this.team[i]>0&&this.blue[i]>0){let r=Math.min(this.blue[i],55*dt);this.team[i]=Math.min(10000,this.team[i]+r);this.blue[i]-=r;}
  if(this.charge&&this.hitstun<=0&&this.attackT<=0){this.ki=clamp(this.ki+0.62*dt,0,7);}
  if(this.attackT>0){this.attackT-=dt;if(this.attackT<=0){this.attackKind='';this.attackDone=false;}}
  if(this.assistT>0)this.assistT-=dt;
  if(this.hp<=0){this.koDelay+=dt;if(this.koDelay>.75){let n=this.nextAlive();if(n<0){this.deadAll=true;}else{this.active=n;this.x=this.teamSide===0?260:1020;this.y=V.ground;this.vx=this.vy=0;this.hitstun=0;this.koDelay=0;this.tagLock=1;}}return;}
  if(this.hitstun<=0&&this.blockstun<=0){
    if(this.superDash){this.sdT-=dt;const dx=enemy.x-this.x,dy=(enemy.y-enemy.h*.35)-(this.y-this.h*.35),d=Math.hypot(dx,dy)||1;this.vx=dx/d*760;this.vy=dy/d*760;if(d<95){hit(this,enemy,520,330,this.face,'sd');this.superDash=false;this.vx*=.15;this.vy*=.15;}if(this.sdT<=0)this.superDash=false;}
    else if(this.dashT>0){this.dashT-=dt;this.vx=this.face*520;}
  }
  if(!this.superDash){this.vy+=1450*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vx*=Math.pow(.0008,dt);} else {this.x+=this.vx*dt;this.y+=this.vy*dt;}
  if(this.y>=V.ground){this.y=V.ground;this.vy=0;this.airOption=true;}
  this.x=clamp(this.x,V.left,V.right);
 }
 nextAlive(){for(let k=1;k<=3;k++){const i=(this.active+k)%3;if(this.team[i]>0)return i;}return -1;}
 move(dir){if(this.hitstun>0||this.blockstun>0||this.attackT>0||this.superDash||this.hp<=0)return;this.vx=dir*245;}
 jump(){if(this.hitstun>0||this.attackT>0||this.hp<=0)return;if(this.onGround()){this.vy=-610;this.y-=2;}else if(this.airOption){this.vy=-560;this.airOption=false;}}
 dash(){if(this.hitstun>0||this.hp<=0)return;this.dashT=.22;}
 doAttack(kind,enemy,projectiles){if(this.hitstun>0||this.blockstun>0||this.attackT>0||this.hp<=0)return;
   let dur=.22,range=95,dmg=360,kb=190;
   if(kind==='M'){dur=.32;range=125;dmg=620;kb=250}
   if(kind==='H'){dur=.43;range=150;dmg=900;kb=380}
   if(kind==='S'){dur=.32;this.attackT=dur;this.attackKind=kind;this.ki=clamp(this.ki+.08,0,7);projectiles.push(new Projectile(this,this.x+this.face*55,this.y-this.h*.58,this.face));return;}
   this.attackT=dur;this.attackKind=kind;this.attackDone=true;
   if(dist(this,enemy)<range+enemy.w*.45&&Math.abs(this.y-enemy.y)<115)hit(this,enemy,dmg,kb,this.face,kind);
 }
 dragonRush(enemy){if(this.hitstun>0||this.attackT>0||this.hp<=0)return;this.attackT=.55;this.attackKind='DR';if(dist(this,enemy)<125&&Math.abs(this.y-enemy.y)<100)hit(this,enemy,950,300,this.face,'throw',true);}
 superDashStart(){if(this.hitstun>0||this.attackT>0||this.hp<=0)return;if(!this.onGround()&&!this.airOption)return;if(!this.onGround())this.airOption=false;this.superDash=true;this.sdT=.9;}
 reflect(enemy){if(this.hitstun>0||this.hp<=0)return;this.attackT=.22;this.attackKind='REF';if(dist(this,enemy)<150){enemy.x+=this.face*170;enemy.vx=this.face*450;enemy.attackT=0;}}
 vanish(enemy){if(this.ki<1||this.hitstun>0||this.hp<=0)return;this.ki-=1;this.invuln=.16;this.x=clamp(enemy.x-enemy.face*85,V.left,V.right);this.y=Math.min(V.ground,enemy.y);this.attackT=.30;this.attackKind='VAN';hit(this,enemy,520,260,this.face,'vanish');}
 assist(enemy){if(this.assistT>0||this.tagLock>0||this.hp<=0||this.aliveCount()<2)return;let slot=this.nextAlive();if(slot<0)return;this.assistT=3.0;this.assistX=clamp(this.x-this.face*120,V.left,V.right);if(Math.abs(enemy.x-this.assistX)<330)hit(this,enemy,520,220,this.face,'assist');}
 tag(){if(this.tagLock>0||this.hitstun>0||this.hp<=0)return;const n=this.nextAlive();if(n<0)return;this.active=n;this.x=clamp(this.x-this.face*110,V.left,V.right);this.y=V.ground-170;this.vy=190;this.tagLock=2.2;this.invuln=.18;}
 spark(){if(this.sparkUsed||this.hp<=0)return;this.sparkUsed=true;this.sparking=true;this.sparkTime=this.aliveCount()===3?8:this.aliveCount()===2?14:21;this.invuln=.22;}
 draw(color){
   if(this.hp<=0)return;
   ctx.save();ctx.translate(this.x,this.y);if(this.face<0)ctx.scale(-1,1);
   if(this.sparking){ctx.shadowBlur=34;ctx.shadowColor='#ffeb75';ctx.strokeStyle='rgba(255,235,117,.8)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,-80,64+rnd(-3,3),0,Math.PI*2);ctx.stroke();}
   if(this.charge){ctx.shadowBlur=28;ctx.shadowColor='#68d7ff';ctx.strokeStyle='#68d7ff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,-72,58+rnd(-6,6),0,Math.PI*2);ctx.stroke();}
   const body=this.flash>0?'#fff':color;ctx.fillStyle=body;ctx.strokeStyle='#07101d';ctx.lineWidth=7;ctx.lineCap='round';
   ctx.beginPath();ctx.arc(0,-125,25,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.beginPath();ctx.moveTo(0,-100);ctx.lineTo(0,-42);ctx.strokeStyle=body;ctx.lineWidth=23;ctx.stroke();
   ctx.strokeStyle=body;ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(-5,-86);ctx.lineTo(-35,-55);ctx.moveTo(8,-86);ctx.lineTo(40,-66);ctx.moveTo(-7,-48);ctx.lineTo(-28,0);ctx.moveTo(7,-48);ctx.lineTo(30,0);ctx.stroke();
   ctx.strokeStyle='#07101d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,-86);ctx.lineTo(-35,-55);ctx.moveTo(8,-86);ctx.lineTo(40,-66);ctx.moveTo(-7,-48);ctx.lineTo(-28,0);ctx.moveTo(7,-48);ctx.lineTo(30,0);ctx.stroke();
   if(this.attackKind){ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='bold 21px Arial';ctx.fillText(this.attackKind,-25,-170);}
   ctx.restore();
   if(this.assistT>2.55){ctx.save();ctx.globalAlpha=.72;ctx.fillStyle=color;ctx.fillRect(this.assistX-20,V.ground-125,40,125);ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText('ASSIST',this.assistX-36,V.ground-140);ctx.restore();}
 }
}
function hit(att,def,dmg,kb,dir,type,unblockable=false){
 if(def.invuln>0||def.hp<=0)return;
 const defending=def.block&&!unblockable;
 if(def.attackKind==='REF'&&type!=='throw'){att.x-=dir*145;att.vx=-dir*420;return;}
 if(defending){def.blockstun=.16;def.vx=dir*kb*.18;def.ki=clamp(def.ki+.055,0,7);att.ki=clamp(att.ki+.035,0,7);return;}
 const mult=(att.sparking?1.18:1)*(att.limitBreak?1.12:1);
 dmg*=mult;def.hp-=dmg;def.rec+=dmg*.27;def.hitstun=type==='H'||type==='sd'||type==='throw'?.38:.22;def.flash=.09;def.vx=dir*kb;if(type==='H'||type==='sd'||type==='throw')def.vy=-Math.min(420,kb*.7);
 att.ki=clamp(att.ki+dmg/4200,0,7);def.ki=clamp(def.ki+dmg/7000,0,7);att.combo++;att.comboT=1.1;
}
const p=new Fighter('P1',false,290,0),cpu=new Fighter('CPU',true,990,1);const projectiles=[];
let timer=300,gameOver=false,winner='';
const keys={left:false,right:false,block:false,charge:false};
const buttons=[];
function btn(id,label,x,y,w,h,kind='tap'){buttons.push({id,label,x,y,w,h,kind,down:new Set()});}
btn('left','◀',35,565,92,92,'hold');btn('right','▶',139,565,92,92,'hold');btn('jump','▲',87,462,92,92);btn('dash','DASH',243,565,100,92);
btn('block','DEF',355,565,92,92,'hold');btn('charge','CHG',459,565,92,92,'hold');
btn('L','L',800,528,82,82);btn('M','M',892,474,82,82);btn('H','H',984,528,82,82);btn('S','S',892,582,82,82);
btn('dr','DR',1080,458,78,60);btn('sd','SD',1170,458,78,60);btn('ref','REF',1080,528,78,60);btn('van','VAN',1170,528,78,60);btn('assist','A1',1080,598,78,60);btn('tag','TAG',1170,598,78,60);btn('spark','SPK',698,584,88,64);
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*V.w,y:(e.clientY-r.top)/r.height*V.h};}
function fire(id){if(gameOver){reset();return;}switch(id){case'jump':p.jump();break;case'dash':p.dash();break;case'L':p.doAttack('L',cpu,projectiles);break;case'M':p.doAttack('M',cpu,projectiles);break;case'H':p.doAttack('H',cpu,projectiles);break;case'S':p.doAttack('S',cpu,projectiles);break;case'dr':p.dragonRush(cpu);break;case'sd':p.superDashStart();break;case'ref':p.reflect(cpu);break;case'van':p.vanish(cpu);break;case'assist':p.assist(cpu);break;case'tag':p.tag();break;case'spark':p.spark();break;}}
function pointerDown(e){e.preventDefault();const q=pos(e);for(const b of buttons)if(q.x>=b.x&&q.x<=b.x+b.w&&q.y>=b.y&&q.y<=b.y+b.h){b.down.add(e.pointerId);if(b.kind==='tap')fire(b.id);syncHolds();break;}canvas.setPointerCapture?.(e.pointerId);}
function pointerUp(e){for(const b of buttons)b.down.delete(e.pointerId);syncHolds();}
function syncHolds(){keys.left=buttons.find(b=>b.id==='left').down.size>0;keys.right=buttons.find(b=>b.id==='right').down.size>0;keys.block=buttons.find(b=>b.id==='block').down.size>0;keys.charge=buttons.find(b=>b.id==='charge').down.size>0;}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);canvas.addEventListener('contextmenu',e=>e.preventDefault());
let aiThink=0,aiBlock=0;
function ai(dt){if(cpu.hp<=0||cpu.deadAll)return;aiThink-=dt;aiBlock-=dt;cpu.block=aiBlock>0;if(cpu.hitstun>0)return;const d=dist(cpu,p);
 if(aiThink<=0){aiThink=rnd(.12,.34);if(p.attackT>0&&d<170&&Math.random()<.52){aiBlock=rnd(.18,.45);cpu.block=true;return;}const r=Math.random();
   if(d>380){if(r<.15)cpu.doAttack('S',p,projectiles);else if(r<.28)cpu.superDashStart();else cpu.move(cpu.x<p.x?1:-1);}
   else if(d>145){if(r<.18)cpu.dash();else if(r<.28)cpu.jump();else cpu.move(cpu.x<p.x?1:-1);}
   else {if(r<.18)cpu.dragonRush(p);else if(r<.48)cpu.doAttack('L',p,projectiles);else if(r<.70)cpu.doAttack('M',p,projectiles);else if(r<.83)cpu.doAttack('H',p,projectiles);else {aiBlock=.28;cpu.block=true;}}
   if(cpu.ki>=1&&Math.random()<.045)cpu.vanish(p);if(!cpu.sparkUsed&&cpu.hp<3600&&Math.random()<.08)cpu.spark();if(cpu.aliveCount()>1&&cpu.hp<2600&&Math.random()<.09)cpu.tag();if(cpu.aliveCount()>1&&Math.random()<.04)cpu.assist(p);
 }}
function reset(){Object.assign(p,new Fighter('P1',false,290,0));Object.assign(cpu,new Fighter('CPU',true,990,1));projectiles.length=0;timer=300;gameOver=false;winner='';}
function update(dt){if(gameOver)return;timer-=dt;if(timer<=0){timer=0;gameOver=true;const a=p.team.reduce((s,v)=>s+v,0),b=cpu.team.reduce((s,v)=>s+v,0);winner=a===b?'EMPATE':a>b?'VOCÊ VENCEU!':'CPU VENCEU';return;}
 p.block=keys.block;p.charge=keys.charge&&!keys.left&&!keys.right;if(keys.left&&!keys.right)p.move(-1);if(keys.right&&!keys.left)p.move(1);ai(dt);p.update(dt,cpu);cpu.update(dt,p);
 for(let i=projectiles.length-1;i>=0;i--){const z=projectiles[i],enemy=z.owner===p?cpu:p;z.update(dt,enemy);if(z.dead)projectiles.splice(i,1);}if(p.deadAll||cpu.deadAll){gameOver=true;winner=cpu.deadAll?'VOCÊ VENCEU!':'CPU VENCEU';}}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill)ctx.fill();if(stroke)ctx.stroke();}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,V.h);g.addColorStop(0,'#17284a');g.addColorStop(.55,'#3b5471');g.addColorStop(1,'#b47b48');ctx.fillStyle=g;ctx.fillRect(0,0,V.w,V.h);
 ctx.fillStyle='rgba(255,235,190,.65)';ctx.beginPath();ctx.arc(1050,125,55,0,Math.PI*2);ctx.fill();for(let i=0;i<9;i++){const x=i*170-70,h=80+(i%4)*27;ctx.fillStyle=i%2?'#32404c':'#293843';ctx.beginPath();ctx.moveTo(x,V.ground);ctx.lineTo(x+70,V.ground-h);ctx.lineTo(x+130,V.ground);ctx.fill();}
 ctx.fillStyle='#7c5a39';ctx.fillRect(0,V.ground,V.w,V.h-V.ground);ctx.fillStyle='#9a754a';for(let i=0;i<24;i++)ctx.fillRect((i*103)%V.w,V.ground+22+(i%4)*31,55,4);}
function bar(x,y,w,h,val,max,color,flip=false,blue=0){ctx.fillStyle='rgba(0,0,0,.55)';roundRect(x,y,w,h,5,true);const f=clamp(val/max,0,1),bf=clamp((val+blue)/max,0,1);if(blue>0){ctx.fillStyle='#6ec7ff';const bw=w*bf;ctx.fillRect(flip?x+w-bw:x,y,bw,h);}ctx.fillStyle=color;const fw=w*f;ctx.fillRect(flip?x+w-fw:x,y,fw,h);ctx.strokeStyle='#fff';ctx.lineWidth=2;roundRect(x,y,w,h,5,false,true);}
function hud(){ctx.font='bold 20px Arial';ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText('VOCÊ',38,32);ctx.textAlign='right';ctx.fillText('CPU',1242,32);bar(38,42,430,29,p.hp,10000,'#f2cb41',false,p.rec);bar(812,42,430,29,cpu.hp,10000,'#ef604b',true,cpu.rec);
 for(let i=0;i<3;i++){const xx=40+i*112;ctx.fillStyle=i===p.active?'#fff':'rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(xx+16,92,15,0,Math.PI*2);ctx.fill();bar(xx+36,82,70,16,p.team[i],10000,'#e9bf3b');}
 for(let i=0;i<3;i++){const xx=1134-i*112;ctx.fillStyle=i===cpu.active?'#fff':'rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(xx+90,92,15,0,Math.PI*2);ctx.fill();bar(xx+5,82,70,16,cpu.team[i],10000,'#e65345',true);}
 ctx.textAlign='center';ctx.font='bold 40px Arial';ctx.fillStyle='#fff';ctx.fillText(Math.ceil(timer),640,58);ctx.font='bold 16px Arial';ctx.fillStyle=p.sparking?'#ffe862':'rgba(255,255,255,.6)';ctx.fillText(p.sparking?'SPARKING!':p.sparkUsed?'SPARK USADO':'SPARK PRONTO',170,127);ctx.fillStyle=cpu.sparking?'#ffe862':'rgba(255,255,255,.6)';ctx.fillText(cpu.sparking?'SPARKING!':cpu.sparkUsed?'SPARK USADO':'SPARK PRONTO',1110,127);
 ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText('KI',40,690);for(let i=0;i<7;i++){ctx.fillStyle=i<p.ki?'#63d6ff':'rgba(255,255,255,.2)';ctx.fillRect(75+i*31,672,24,18);}ctx.fillText(p.ki.toFixed(1),300,690);
 ctx.textAlign='right';ctx.fillText('KI',1240,690);for(let i=0;i<7;i++){ctx.fillStyle=i<cpu.ki?'#ff7887':'rgba(255,255,255,.2)';ctx.fillRect(1175-i*31,672,24,18);}ctx.fillText(cpu.ki.toFixed(1),975,690);
 if(p.combo>1&&p.comboT>0){ctx.textAlign='left';ctx.font='bold 32px Arial';ctx.fillStyle='#fff';ctx.fillText(p.combo+' HITS',80,190);}if(cpu.combo>1&&cpu.comboT>0){ctx.textAlign='right';ctx.fillText(cpu.combo+' HITS',1200,190);}if(p.limitBreak){ctx.textAlign='left';ctx.font='bold 18px Arial';ctx.fillStyle='#ffe469';ctx.fillText('LIMIT BREAK',40,150);}if(cpu.limitBreak){ctx.textAlign='right';ctx.fillText('LIMIT BREAK',1240,150);}}

function draw(){ctx.setTransform(sx,0,0,sy,0,0);ctx.clearRect(0,0,V.w,V.h);drawBackground();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([8,10]);ctx.beginPath();ctx.moveTo(V.left,V.ground);ctx.lineTo(V.left,180);ctx.moveTo(V.right,V.ground);ctx.lineTo(V.right,180);ctx.stroke();ctx.setLineDash([]);
