plugins { id 'application' }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':ultra-core')
    implementation project(':story-core')
    implementation project(':stage-core')
}

application {
    mainClass = 'com.gamelutagpt.preview.UltraPreview'
}

// Caminhos relativos nos argumentos (ex.: a pasta do ultra) partem da pasta android/.
tasks.named('run') {
    workingDir = rootProject.projectDir
}

// Cenário: gradle :pc-preview:runStage --args="app/src/main/assets/stages/templo_lua"
tasks.register('runStage', JavaExec) {
    group = 'application'
    description = 'Abre o visualizador de cenário com a câmera de luta simulada.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gamelutagpt.preview.StagePreview'
    workingDir = rootProject.projectDir
}

// Atores de fundo: gradle :pc-preview:runAtor --args="app/src/main/assets/stages/dojo_shinshinkan takatoshi parado,aplaudir,rir,surpreso,aprovar 345 build/ator.png"
tasks.register('runAtor', JavaExec) {
    group = 'application'
    description = 'Grava uma folha de conferência das animações de um ator de fundo.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gamelutagpt.preview.AtorPreview'
    workingDir = rootProject.projectDir
}

// Raio final do ultra no cenário, gravado em PNG: gradle :pc-preview:runRaio
tasks.register('runRaio', JavaExec) {
    group = 'application'
    description = 'Grava os quadros do raio final do ultra em build/raio/.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gamelutagpt.preview.RaioPreview'
    workingDir = rootProject.projectDir
    args 'app/src/main/assets/ultras/player_base', 'app/src/main/assets/stages/templo_lua',
        '--quadros', 'build/raio'
}

// Modo história: grava cada página dos episódios em PNG: gradle :pc-preview:runHistoria
tasks.register('runHistoria', JavaExec) {
    group = 'application'
    description = 'Grava as páginas dos episódios do modo história em build/historia/.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gamelutagpt.preview.HistoriaPreview'
    workingDir = rootProject.projectDir
    args 'app/src/main/assets', 'build/historia'
    // Outro idioma: gradle :pc-preview:runHistoria -Pidioma=en
    systemProperty 'idioma', project.findProperty('idioma') ?: 'pt'
    // Campanha do Kōga e outra chave: -Pirmao=koga -Psorteio=3
    systemProperty 'irmao', project.findProperty('irmao') ?: 'ryuga'
    systemProperty 'sorteio', project.findProperty('sorteio') ?: '1'
    // Perde as quartas e segue pela repescagem: -Prepescagem=true
    systemProperty 'repescagem', project.findProperty('repescagem') ?: 'false'
}

// Menu inicial e pausa em PNG: gradle :pc-preview:runMenu (-Pidioma=en para outro idioma)
tasks.register('runMenu', JavaExec) {
    group = 'application'
    description = 'Grava o menu inicial e a pausa em build/menu/.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gamelutagpt.preview.MenuPreview'
    workingDir = rootProject.projectDir
    args 'app/src/main/assets', 'build/menu'
    systemProperty 'idioma', project.findProperty('idioma') ?: 'pt'
}
