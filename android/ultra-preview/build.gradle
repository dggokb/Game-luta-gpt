plugins { id 'application' }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':ultra-core')
}

application {
    mainClass = 'com.gamelutagpt.ultra.preview.UltraPreview'
}

// Caminhos relativos nos argumentos (ex.: a pasta do ultra) partem da pasta android/.
tasks.named('run') {
    workingDir = rootProject.projectDir
}
