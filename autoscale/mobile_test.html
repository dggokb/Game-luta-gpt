<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sprites — Escala automática</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#1b1f27;color:#e8ecf2;font:15px/1.35 system-ui,sans-serif;-webkit-user-select:none;user-select:none}
header{padding:10px 12px 4px}header h1{font-size:17px;margin:0 0 4px}header p{margin:0;font-size:13px;color:#aab3c2}
.row{display:flex;gap:6px;padding:6px 12px;flex-wrap:wrap;align-items:center}
button,select{background:#2a3140;color:#e8ecf2;border:1px solid #3c4557;border-radius:8px;padding:9px 12px;font-size:15px}
button[aria-pressed="true"]{background:#3b82f6;border-color:#3b82f6;color:#fff}
.panes{display:flex;gap:4px;padding:0 6px}
.pane{flex:1;min-width:0;background:#11141a;border-radius:8px;overflow:hidden;position:relative}
.pane h2{position:absolute;left:8px;top:6px;margin:0;font-size:13px;font-weight:600;z-index:2}
.pane.before h2{color:#ffb454}.pane.after h2{color:#5ee07a}
.pane small{position:absolute;left:8px;bottom:6px;font-size:12px;color:#aab3c2;z-index:2}
canvas{display:block;width:100%;height:auto;touch-action:none}
input[type=range]{flex:1;min-width:120px}
#single .pane.before{display:none}
.hint{padding:4px 12px 10px;font-size:12px;color:#aab3c2}
</style></head><body>
<header><h1>Sprites — Escala automática (teste)</h1><p>Esquerda: pipeline atual. Direita: escala por frame, automática. Mesmo zoom e mesmo chão.</p></header>
<div class="row"><select id="char"></select><select id="mode">
<option value="seq">Idle → dash → Idle</option><option value="cycle">Só o ciclo de corrida</option><option value="dash">Dash completo</option><option value="idle">Idle</option></select>
<button id="play" aria-pressed="true">Pausar</button></div>
<div class="row"><button id="prev">◀</button><input id="seek" type="range" min="0" max="1" value="0"><button id="next">▶</button></div>
<div class="row"><span>Velocidade</span><button data-speed="1" aria-pressed="true">1×</button><button data-speed="0.5">½</button><button data-speed="0.25">¼</button>
<span style="margin-left:auto">Zoom</span><input id="zoom" type="range" min="0.6" max="2.5" step="0.05" value="1" style="min-width:90px;max-width:140px"><button id="single" aria-pressed="false">Só depois</button></div>
<div class="panes" id="panes">
<div class="pane before"><h2>ANTES · atual</h2><canvas id="cb"></canvas><small id="ib"></small></div>
<div class="pane after"><h2>DEPOIS · automático</h2><canvas id="ca"></canvas><small id="ia"></small></div></div>
<div class="row"><span id="status" style="font-size:13px;color:#aab3c2"></span></div>
<div class="hint" id="hint"></div>
<script>
const data=__MANIFEST__;
const chars=Object.keys(data.characters);const W=data.crop[2]-data.crop[0],H=data.crop[3]-data.crop[1];
const $=id=>document.getElementById(id);
chars.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c.toUpperCase();$('char').append(o)});
let char=chars[0],mode='seq',playing=true,speed=1,pos=0,acc=0,last=null,seq=[],cache=new Map();
function build(){const ch=data.characters[char];const idle=ch.clips.idle,dash=ch.clips.dash;seq=[];
  const cyc=dash.cycle?Array.from({length:dash.cycle.stop_exclusive-dash.cycle.start},(_,i)=>dash.cycle.start+i):dash.frames.map(f=>f.index);
  if(mode==='idle')seq=idle.frames.map(f=>['idle',f.index]);
  else if(mode==='dash')seq=dash.frames.map(f=>['dash',f.index]);
  else if(mode==='cycle')seq=cyc.map(i=>['dash',i]);
  else{for(let i=0;i<48;i++)seq.push(['idle',i]);for(let r=0;r<3;r++)cyc.forEach(i=>seq.push(['dash',i]));for(let i=48;i<idle.frames.length;i++)seq.push(['idle',i])}
  $('seek').max=seq.length-1;pos=Math.min(pos,seq.length-1);
  const c=dash.cycle;$('hint').textContent=`${char.toUpperCase()}: antes, o corpo no dash vai de ${dash.before_minmax[0].toFixed(2)} a ${dash.before_minmax[1].toFixed(2)} do mestre; depois, ${dash.after_p5_p95[0].toFixed(2)} a ${dash.after_p5_p95[1].toFixed(2)}. `+(c?`Ciclo: fontes ${c.start} a ${c.stop_exclusive-1} (${c.period} frames), emenda IoU ${c.seam_iou}.`:'');}
function img(src){if(cache.has(src))return cache.get(src);const im=new Image();im.src=src;cache.set(src,im);if(cache.size>700){const k=cache.keys().next().value;cache.delete(k)}return im;}
function draw(){const [clip,i]=seq[pos];const f=data.characters[char].clips[clip].frames[i];const z=Number($('zoom').value);
  for(const [id,src,info] of [['cb',f.raw_file,`${clip} ${i} · corpo ${f.size_before.toFixed(2)}× do mestre`],['ca',f.normalized_file,`${clip} ${i} · corpo ${f.size_after.toFixed(2)}× · escala ${f.scale.toFixed(3)}`]]){
    const cv=$(id);if(cv.width!==W){cv.width=W;cv.height=H}const ctx=cv.getContext('2d');ctx.fillStyle='#11141a';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H-40);ctx.scale(z,z);ctx.translate(-W/2,-(H-40));
    ctx.strokeStyle='#3c4557';ctx.beginPath();ctx.moveTo(-W,H-40);ctx.lineTo(2*W,H-40);ctx.stroke();
    const im=img(src);if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0);else im.onload=()=>draw();ctx.restore();
    $(id==='cb'?'ib':'ia').textContent=info;}
  $('seek').value=pos;$('status').textContent=`${pos+1}/${seq.length}`;
  for(let k=1;k<=6;k++){const n=seq[(pos+k)%seq.length];const g=data.characters[char].clips[n[0]].frames[n[1]];img(g.raw_file);img(g.normalized_file)}}
function tick(t){if(last!==null&&playing){acc+=(t-last)*speed;const step=1000/data.fps;while(acc>=step){acc-=step;pos=(pos+1)%seq.length}}last=t;draw();requestAnimationFrame(tick)}
$('char').onchange=e=>{char=e.target.value;pos=0;build()};$('mode').onchange=e=>{mode=e.target.value;pos=0;build()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pausar':'Reproduzir';$('play').setAttribute('aria-pressed',playing)};
$('prev').onclick=()=>{playing=false;$('play').textContent='Reproduzir';pos=(pos-1+seq.length)%seq.length};
$('next').onclick=()=>{playing=false;$('play').textContent='Reproduzir';pos=(pos+1)%seq.length};
$('seek').oninput=e=>{playing=false;$('play').textContent='Reproduzir';pos=Number(e.target.value)};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('single').onclick=()=>{const on=$('panes').id!=='single-on';$('panes').id=on?'single-on':'panes';document.body.classList.toggle('single',on);$('single').setAttribute('aria-pressed',on);document.querySelector('.pane.before').style.display=on?'none':''};
build();requestAnimationFrame(tick);
</script></body></html>
